<script>
(function(){
  function pointCafeStandalone(){
    try {
      return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) ||
             window.navigator.standalone === true ||
             document.referrer.indexOf('android-app://') === 0;
    } catch(e){ return false; }
  }
  function applyInstalledMode(){
    if(!pointCafeStandalone()) return;
    document.documentElement.classList.add('pwa-standalone');
    var ids=['pwa-install-modal'];
    ids.forEach(function(id){ var el=document.getElementById(id); if(el) el.remove(); });
    document.querySelectorAll('.pwa-install-page-btn,[data-pwa-install],.install-app-button').forEach(function(el){ el.remove(); });
  }
  applyInstalledMode();
  document.addEventListener('DOMContentLoaded',applyInstalledMode);
  window.addEventListener('load',applyInstalledMode);
  setTimeout(applyInstalledMode,250);
  setTimeout(applyInstalledMode,1000);
})();
</script>
